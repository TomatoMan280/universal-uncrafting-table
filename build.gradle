plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.findProperty('testNeoVersion') ?: neo_version

    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        client {
            client()
            gameDirectory = file(project.findProperty('clientDir') ?: 'run')
            if (Boolean.parseBoolean(project.findProperty('clientAutoTest')?.toString() ?: 'false')) {
                systemProperty 'uncrafting_table.autoClientTest', 'true'
                systemProperty 'uncrafting_table.autoClientTestExit', 'true'
            }
            if (project.hasProperty('clientJvm')) {
                jvmArgument project.property('clientJvm').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file(project.findProperty('serverDir') ?: 'run')
            if (Boolean.parseBoolean(project.findProperty('autoSweep')?.toString() ?: 'false')) {
                systemProperty 'uncrafting_table.autoSweepOnWorldLoad', 'true'
                systemProperty 'uncrafting_table.exitAfterAutoSweep', 'true'
            }
            if (project.hasProperty('serverJvm')) {
                jvmArgument project.property('serverJvm').toString()
            }
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file(project.findProperty('gametestDir') ?: 'run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('gametestJvm')) {
                jvmArgument project.property('gametestJvm').toString()
            }
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        uncrafting_table_gametest {
            sourceSet sourceSets.gametest
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
        loadedMods = [mods."${mod_id}"]
    }
}

neoForge.runs.gameTestServer.loadedMods = [neoForge.mods."${mod_id}", neoForge.mods.uncrafting_table_gametest]
neoForge.runs.client.loadedMods = [neoForge.mods."${mod_id}"]
neoForge.runs.server.loadedMods = [neoForge.mods."${mod_id}"]
neoForge.runs.data.loadedMods = [neoForge.mods."${mod_id}"]

repositories {
    mavenCentral()
    maven {
        name = 'Jared Maven'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (!project.hasProperty('skipRuntimeJei')) {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    testImplementation "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}

test {
    useJUnitPlatform()
}

tasks.named('runGameTestServer') {
    mustRunAfter tasks.named('test')
}

tasks.named('runClient') {
    doLast {
        if (Boolean.parseBoolean(project.findProperty('clientAutoTest')?.toString() ?: 'false')) {
            def clientDir = file(project.findProperty('clientDir') ?: 'run')
            def report = new File(clientDir, 'uncrafting_client_gui_report.txt')
            if (!report.exists()) {
                throw new GradleException("Missing client GUI test report: ${report}")
            }
            def text = report.getText('UTF-8')
            if (!text.contains('STATUS: PASSED') || !text.contains('Failures: 0')) {
                throw new GradleException("Client GUI auto-test failed:\n${text}")
            }
        }
    }
}

tasks.named('runServer') {
    doLast {
        if (Boolean.parseBoolean(project.findProperty('autoSweep')?.toString() ?: 'false')) {
            def serverDir = file(project.findProperty('serverDir') ?: 'run')
            def report = new File(serverDir, 'uncrafting_test_report.txt')
            if (!report.exists()) {
                throw new GradleException("Missing server sweep report: ${report}")
            }
            def text = report.getText('UTF-8')
            if (!text.contains('Errors / self-loops: 0')) {
                throw new GradleException("Server auto-sweep reported errors:\n${text}")
            }
        }
    }
}

tasks.register('verifyAllVanilla') {
    group = 'verification'
    description = 'Runs JUnit tests, vanilla NeoForge GameTests, and builds the mod jar.'
    dependsOn 'test', 'runGameTestServer', 'build'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('repo')
        }
    }
}
