name: CI Build and Automated Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run JUnit, Vanilla GameTests, and Build Jar
        run: ./gradlew verifyAllVanilla -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: build/reports/tests/test/

      - name: Upload Vanilla Uncrafting Sweep Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uncrafting-sweep-report
          path: run-gametest/uncrafting_test_report.txt

      - name: Upload Built Mod Jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uncrafting-table-jar
          path: build/libs/*.jar
